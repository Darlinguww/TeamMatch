networks:
  teammatch-net:
    driver: bridge
 
volumes:
  # neo4j_data:
  # neo4j_logs:
  backend_node_modules:
  ai_service_node_modules:

services:
  # ─────────────────────────────────────────────
  # NEO4J — Local desactivado; backend usa Aura (.env)
  # NEO4J_URI=neo4j+s://<INSTANCE_ID>.databases.neo4j.io
  # ─────────────────────────────────────────────
  # neo4j:
  #   image: neo4j:5.26.0-community
  #   container_name: teammatch-neo4j
  #   ports:
  #     - '7474:7474'
  #     - '7687:7687'
  #   environment:
  #     - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
  #     - NEO4J_server_memory_heap_initial__size=256m
  #     - NEO4J_server_memory_heap_max__size=768m
  #     - NEO4J_server_memory_pagecache_size=256m
  #   volumes:
  #     - neo4j_data:/data
  #     - neo4j_logs:/logs
  #     - ./neo4j/init:/docker-entrypoint-initdb.d
  #   networks:
  #     - teammatch-net
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 12
  #     start_period: 60s
 
  # ─────────────────────────────────────────────
  # FRONTEND — React + Vite + TypeScript
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: teammatch-frontend
    ports:
      - '5173:5173'
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - VITE_USE_API_AUTH=${VITE_USE_API_AUTH}
      - VITE_AI_SERVICE_URL=${VITE_AI_SERVICE_URL}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - teammatch-net
    restart: unless-stopped
 
  # ─────────────────────────────────────────────
  # BACKEND — Node.js + Express + TypeScript (Neo4j Aura vía .env)
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teammatch-backend
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${PORT:-3000}
      - AI_SERVICE_URL=http://ai-service:3001
    volumes:
      - ./backend:/app
    depends_on:
      ai-service:
        condition: service_started
    networks:
      - teammatch-net
    restart: unless-stopped
 
  # ─────────────────────────────────────────────
  # AI SERVICE — Azure OpenAI gpt-4.1-mini (extracción + matchmaking)
  # ─────────────────────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: teammatch-ai
    command: npm run dev
    ports:
      - '3001:3001'
    environment:
      - PORT=3001
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_DEPLOYMENT_NAME=${AZURE_OPENAI_DEPLOYMENT_NAME}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB}
      - PROCESSING_TIMEOUT_MS=${PROCESSING_TIMEOUT_MS}
      - NODE_ENV=${NODE_ENV}
    volumes:
      - ./ai-service:/app
      - ai_service_node_modules:/app/node_modules
    networks:
      - teammatch-net
    restart: unless-stopped
